<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeriesMaker AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #aab4d0;
      margin-bottom: 30px;
    }

    .card {
      background: #151c32;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #33405f;
      background: #0d1428;
      color: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      padding: 15px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #6d5dfc;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      display: none;
      white-space: pre-wrap;
      line-height: 1.7;
      background: #0d1428;
      padding: 16px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .badge {
      display: inline-block;
      background: #253052;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .footer {
      text-align: center;
      color: #6f7b9d;
      font-size: 13px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎬 SeriesMaker AI</h1>

  <div class="subtitle">
    צור רעיונות ותסריטים לסדרה במקום אחד
  </div>

  <div class="card">

    <span class="badge">AI Series Creator</span>

    <label>שם הסדרה</label>
    <input
      id="seriesName"
      placeholder="לדוגמה: העיר הסודית"
    >

    <label>סוג הסדרה</label>

    <select id="genre">
      <option>אנימציה</option>
      <option>קומדיה</option>
      <option>הרפתקה</option>
      <option>פנטזיה</option>
      <option>מסתורין</option>
      <option>מדע בדיוני</option>
    </select>

    <label>למי הסדרה מיועדת?</label>

    <select id="audience">
      <option>לכולם</option>
      <option>ילדים</option>
      <option>נוער</option>
      <option>משפחה</option>
    </select>

    <label>הרעיון שלך</label>

    <textarea
      id="idea"
      placeholder="כתוב בקצרה מה אתה רוצה שיקרה בסדרה..."
    ></textarea>

    <button onclick="generateSeries()">
      ✨ צור תסריט
    </button>

    <div id="result" class="result"></div>

  </div>

  <div class="card">

    <h2>📺 מה אפשר ליצור?</h2>

    <p>✓ רעיון לסדרה</p>
    <p>✓ דמויות</p>
    <p>✓ תקציר לפרק</p>
    <p>✓ סצנות</p>
    <p>✓ דיאלוגים</p>
    <p>✓ בסיס לפרומפט ליצירת וידאו</p>

  </div>

  <div class="footer">
    SeriesMaker AI
  </div>

</div>

<script>

function generateSeries() {

  const name =
    document.getElementById("seriesName").value.trim();

  const genre =
    document.getElementById("genre").value;

  const audience =
    document.getElementById("audience").value;

  const idea =
    document.getElementById("idea").value.trim();

  const result =
    document.getElementById("result");

  if (!name || !idea) {

    result.style.display = "block";

    result.textContent =
      "יש להזין שם לסדרה ורעיון בסיסי.";

    return;
  }

  const text =
`🎬 שם הסדרה:
${name}

🎭 ז'אנר:
${genre}

👥 קהל:
${audience}

💡 רעיון מרכזי:
${idea}

📖 תקציר לפרק הראשון:

הסיפור מתחיל בעולם שבו משהו לא צפוי עומד להשתנות.

הדמות הראשית מגלה רמז מסתורי שמוביל אותה להרפתקה חדשה.

בדרך היא פוגשת דמויות חדשות, מתמודדת עם אתגר ומגלה שהאירוע קשור למשהו גדול הרבה יותר.

🎞️ סצנה 1:
היכרות עם העולם והדמות הראשית.

🎞️ סצנה 2:
אירוע בלתי צפוי משנה את המצב.

🎞️ סצנה 3:
הדמות מחליטה לצאת למשימה.

🎞️ סיום:
מתגלה רמז חדש שמשאיר מתח לפרק הבא.

✨ הפרק הבא ממשיך את ההרפתקה.`;

  result.textContent = text;

  result.style.display = "block";

  result.scrollIntoView({
    behavior: "smooth"
  });
}

</script>

</body>
</html>
